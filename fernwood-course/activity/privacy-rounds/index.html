<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Patient Privacy Rounds</title>

<style id="brand-defaults">
/* ==================================================================
   THE SEVEN BRAND VARIABLES.
   These are the neutral defaults. brand/brand.css, written by the
   skill alongside scenario.js, is loaded after this block and
   overrides whichever of them the client's brand sets. Nothing else
   in this page carries a colour, a corner or a typeface of its own —
   not even the office furniture, which is tinted with these at paint
   time.
   ================================================================== */
:root{
  --brand-accent:#FF7366;
  --brand-ink:#17191c;
  --brand-surface:#ffffff;
  --brand-bg:#0f1013;
  --brand-radius:12px;
  --brand-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --brand-accent-2:#ffc53d;
}
</style>

<!-- The brand the skill wrote. Missing folder = the defaults above stand. -->
<link rel="stylesheet" href="brand/brand.css" id="brand-link">
<script>
/* The capture harness points this at a second brand folder to prove the
   re-skin. With no ?brand= on the URL the page uses brand/ and nothing
   about it changes. */
(function () {
  var m = /[?&]brand=([^&]*)/.exec(window.location.search);
  window.BRAND_DIR = "brand/";
  if (!m) { return; }
  var dir = decodeURIComponent(m[1].replace(/\+/g, " ")).replace(/\/?$/, "/");
  window.BRAND_DIR = dir;
  document.getElementById("brand-link").href = dir + "brand.css";
})();
</script>

<style>
/* ==================================================================
   THE FLOOR — a day on a pixel office floor.
   The room and the people are rendered art files (art/*). Nothing here
   draws a room. Code draws UI chrome only — strips, panels, bars, the
   clock, the markers over people's heads — and tints the furniture
   layer with the brand accent.
   ================================================================== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%;background:var(--brand-bg)}
body{
  color:var(--brand-ink);
  font:17px/1.6 var(--brand-font);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.frame{max-width:1200px;margin:0 auto;height:100svh;padding:12px 16px 10px;display:flex;flex-direction:column}
.screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.screen[hidden]{display:none}
.panel{
  background:var(--brand-surface);
  border-radius:var(--brand-radius);
  color:var(--brand-ink);
  box-shadow:0 1px 2px color-mix(in srgb,var(--brand-ink) 10%,transparent),
             0 10px 28px color-mix(in srgb,var(--brand-ink) 16%,transparent);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font:800 15px/1 var(--brand-font);letter-spacing:.01em;
  padding:13px 18px;border:0;cursor:pointer;
  border-radius:calc(var(--brand-radius) / 1.6);
  background:color-mix(in srgb,var(--brand-accent-2) 26%,var(--brand-surface));
  color:var(--brand-ink);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 18%,var(--brand-surface));
}
.btn:hover{box-shadow:inset 0 0 0 2px var(--brand-accent)}
.btn-primary{background:var(--brand-accent);color:#FFFFFF;box-shadow:none}
.btn-primary:hover{background:color-mix(in srgb,var(--brand-accent) 86%,#FFFFFF);box-shadow:none}
:focus-visible{outline:3px solid var(--brand-accent);outline-offset:3px}
.screen:focus,.screen:focus-visible{outline:none}

/* ---------- title card ---------- */
.titlecard{justify-content:flex-start;align-items:center;padding:28px 22px;gap:0;overflow:auto}
.titlecard .inner{max-width:620px;width:100%;margin:auto 0} /* centred when it fits, scrolls from the top when it doesn't */
.titlecard img.logo{height:44px;width:auto;display:block;margin:0 0 18px;image-rendering:auto}
.titlecard .eyebrow{margin:0 0 10px;font:800 12px/1.3 var(--brand-font);letter-spacing:.18em;
  color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface))}
.titlecard h1{margin:0 0 12px;font:800 clamp(24px,3.6vw,38px)/1.12 var(--brand-font);letter-spacing:-.015em}
.titlecard .lede{margin:0 0 14px;font-size:18px}
.howlist{list-style:none;margin:0 0 18px;padding:0;max-width:560px;font-size:14.5px;line-height:1.45}
.howlist li{position:relative;padding:0 0 6px 18px}
.howlist li::before{content:"";position:absolute;left:0;top:8px;width:7px;height:7px;
  background:var(--brand-accent-2);border-radius:calc(var(--brand-radius) / 6)}
.goalline{display:flex;align-items:flex-start;gap:10px;margin:0 0 18px;padding:12px 14px;
  border-radius:calc(var(--brand-radius) / 1.4);
  background:color-mix(in srgb,var(--brand-accent-2) 22%,var(--brand-surface));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-accent-2) 60%,var(--brand-surface));
  font:700 16px/1.4 var(--brand-font)}
.goalline i{display:block;width:10px;height:10px;flex:none;margin-top:7px;background:var(--brand-accent);
  border-radius:calc(var(--brand-radius) / 5)}
.namebox{padding:13px 15px;margin:0 0 18px;max-width:470px;
  border-radius:calc(var(--brand-radius) / 1.4);
  background:color-mix(in srgb,var(--brand-ink) 4%,var(--brand-surface));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 14%,var(--brand-surface))}
.namebox label{display:block;font:700 12px/1.4 var(--brand-font);letter-spacing:.08em;
  color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface));margin-bottom:8px}
.namerow{display:flex;gap:9px;flex-wrap:wrap}
.namebox input{flex:1 1 170px;min-width:0;background:var(--brand-surface);color:var(--brand-ink);border:0;
  border-radius:calc(var(--brand-radius) / 2);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 18%,var(--brand-surface));
  padding:11px;font:16px/1.2 var(--brand-font)}
.namebox input:focus{box-shadow:inset 0 0 0 2px var(--brand-accent);outline:none}
.namebox input::placeholder{color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface));opacity:1}
.namebox .btn{padding:11px 14px;font-size:14px}
.hint{margin:14px 0 0;font-size:13.5px;color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface))}
.kbd{display:inline-block;padding:2px 7px;font:700 12px/1.5 var(--brand-font);
  border-radius:calc(var(--brand-radius) / 3);
  background:color-mix(in srgb,var(--brand-ink) 8%,var(--brand-surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-ink) 22%,var(--brand-surface))}

/* ---------- title strip ---------- */
.topstrip{flex:0 0 auto;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:10px 14px}
.brandmark{flex:0 0 auto;display:flex;align-items:center;gap:9px;height:28px;order:1}
.brandmark img{height:28px;width:auto;display:block;image-rendering:auto}
.brandmark .fallback{display:flex;align-items:center;gap:9px;
  font:800 14px/1 var(--brand-font);letter-spacing:.14em;color:var(--brand-ink)}
.brandmark .fallback i{width:12px;height:12px;background:var(--brand-accent);display:block;flex:none}
.scenetitle{flex:1 1 auto;min-width:0;order:2;margin:0;
  font:800 clamp(14px,1.7vw,20px)/1.25 var(--brand-font);letter-spacing:-.01em;color:var(--brand-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{flex:0 0 auto;order:3;display:flex;gap:6px}
.goalchip{flex:0 0 auto;order:4;display:flex;align-items:center;gap:8px;padding:5px 10px;
  border-radius:calc(var(--brand-radius) / 2);
  background:color-mix(in srgb,var(--brand-accent-2) 22%,var(--brand-surface));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-accent-2) 70%,var(--brand-surface))}
.goalchip b{font:900 17px/1 var(--brand-font);letter-spacing:.02em;white-space:nowrap}
.goalchip b i{font-style:normal;font-weight:700;opacity:.5;padding:0 2px}
.goalchip .gl{font:700 11.5px/1.2 var(--brand-font);letter-spacing:.02em;max-width:150px;
  color:color-mix(in srgb,var(--brand-ink) 72%,var(--brand-surface))}
.goalchip.met{background:var(--brand-accent);box-shadow:none;color:#FFFFFF}
.goalchip.met .gl{color:#FFFFFF}
@media (max-width:760px){.goalchip{order:7}.goalchip .gl{max-width:none}}
/* idle dots wear the second accent: a pale ring, never behind text */
.dot{width:16px;height:16px;border-radius:calc(var(--brand-radius) / 4);
  display:flex;align-items:center;justify-content:center;
  font:900 11px/1 var(--brand-font);color:transparent;
  background:color-mix(in srgb,var(--brand-accent-2) 20%,var(--brand-surface));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-accent-2) 62%,var(--brand-surface))}
.dot.now{box-shadow:inset 0 0 0 2px var(--brand-accent)}
.dot.right{background:var(--brand-accent);box-shadow:none;color:#FFFFFF}
.dot.soft{background:var(--brand-surface);box-shadow:inset 0 0 0 2px var(--brand-accent);color:var(--brand-accent)}
.dot.wrong{background:color-mix(in srgb,var(--brand-ink) 72%,var(--brand-surface));box-shadow:none;color:var(--brand-surface)}

.clockbox{flex:0 0 auto;order:4;width:104px;text-align:right}
.clock{font:800 26px/1 var(--brand-font);letter-spacing:-.01em;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.clock .late{display:inline-block;vertical-align:3px;margin-left:6px;padding:2px 5px;
  font:900 9px/1 var(--brand-font);letter-spacing:.12em;color:#FFFFFF;background:var(--brand-accent);
  border-radius:calc(var(--brand-radius) / 5)}
.daybar{position:relative;height:9px;margin-top:7px;overflow:hidden;
  border-radius:calc(var(--brand-radius) / 3);
  background:color-mix(in srgb,var(--brand-accent-2) 34%,var(--brand-surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-accent-2) 70%,var(--brand-surface))}
.daybar b{position:absolute;inset:0 auto 0 0;width:0;background:var(--brand-accent)}
.daybar u{position:absolute;top:0;bottom:0;width:1px;background:var(--brand-surface);opacity:.8}

/* ---------- the floor and the talk panel ---------- */
.playrow{flex:1 1 auto;min-height:0;display:flex;gap:10px}
.playrow.left{flex-direction:row-reverse}
.stagehost{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.stage{position:relative;line-height:0;padding:10px;
  background:var(--brand-surface);
  border-radius:var(--brand-radius);
  box-shadow:0 2px 4px color-mix(in srgb,var(--brand-ink) 10%,transparent),
             0 18px 44px color-mix(in srgb,var(--brand-ink) 22%,transparent)}
.stage canvas{display:block;border-radius:calc(var(--brand-radius) / 3);cursor:pointer}
.stage .gloss{position:absolute;inset:10px;pointer-events:none;
  border-radius:calc(var(--brand-radius) / 3);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand-ink) 14%,transparent)}
.floaty{position:absolute;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);white-space:nowrap}
.nametag{
  display:flex;align-items:center;gap:7px;transform:translate(-50%,0);
  background:var(--brand-surface);color:var(--brand-ink);
  border-radius:calc(var(--brand-radius) / 2);
  border:1px solid color-mix(in srgb,var(--brand-accent) 55%,var(--brand-surface));
  box-shadow:0 6px 18px color-mix(in srgb,var(--brand-ink) 30%,transparent);
  padding:4px 9px;font:800 12px/1.2 var(--brand-font);letter-spacing:.05em}
.nametag i{font-style:normal;font-weight:700;color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface))}
.nametag s{display:block;width:7px;height:7px;flex:none;text-decoration:none;
  background:var(--brand-accent-2);border-radius:calc(var(--brand-radius) / 6)}
.prompt{
  background:var(--brand-accent);color:#FFFFFF;
  border-radius:calc(var(--brand-radius) / 2);
  box-shadow:0 6px 18px color-mix(in srgb,var(--brand-ink) 34%,transparent);
  padding:5px 10px;font:800 12.5px/1.2 var(--brand-font);letter-spacing:.04em}
.signtag{
  transform:translate(-50%,-100%);
  border-radius:calc(var(--brand-radius) / 3);
  padding:4px 9px;font:800 11.5px/1.2 var(--brand-font);letter-spacing:.03em;
  box-shadow:0 5px 14px color-mix(in srgb,var(--brand-ink) 30%,transparent)}
.signtag.bad{background:var(--brand-ink);color:#FFFFFF;
  box-shadow:0 5px 14px color-mix(in srgb,var(--brand-ink) 30%,transparent),inset 0 0 0 2px var(--brand-accent)}
.signtag.soft{background:var(--brand-accent-2);color:var(--brand-ink)}
.signtag.good{background:var(--brand-surface);color:var(--brand-ink);
  box-shadow:0 5px 14px color-mix(in srgb,var(--brand-ink) 30%,transparent),inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 18%,var(--brand-surface))}
.popbubble{
  background:var(--brand-surface);color:var(--brand-ink);
  border-radius:calc(var(--brand-radius) / 2);
  box-shadow:0 6px 18px color-mix(in srgb,var(--brand-ink) 34%,transparent),
             inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 18%,var(--brand-surface));
  padding:4px 10px;font:900 15px/1.2 var(--brand-font)}
.popbubble.bad{box-shadow:0 6px 18px color-mix(in srgb,var(--brand-ink) 34%,transparent),
             inset 0 0 0 2px var(--brand-accent);color:var(--brand-accent)}

/* ---------- the speech bubble ----------
   Absolutely positioned inside .stage, placed by placeTalk() beside the
   coworker's head, with a tail pointing at them. Never changes the floor's size. */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.talkpanel{position:absolute;z-index:6;width:min(390px,calc(100% - 24px));max-height:calc(100% - 24px);
  display:flex;flex-direction:column;overflow:visible;
  background:var(--brand-surface);color:var(--brand-ink);
  border-radius:calc(var(--brand-radius) / 1.4);
  box-shadow:0 10px 30px color-mix(in srgb,var(--brand-ink) 36%,transparent),
             inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 16%,var(--brand-surface))}
.talkbody{flex:1 1 auto;min-height:0;overflow:auto;padding:13px 15px 14px;
  border-radius:calc(var(--brand-radius) / 1.4)}
/* the reply popup: the coworker's reaction on its own, after the office has reacted */
.talkpanel.reply .verdict{margin-top:0;padding-top:0;border-top:0}
.talkpanel .tail{position:absolute;width:0;height:0;border:11px solid transparent;pointer-events:none}
.talkpanel.tail-left .tail{left:-20px;border-right-color:var(--brand-surface);
  filter:drop-shadow(-2px 0 0 color-mix(in srgb,var(--brand-ink) 16%,var(--brand-surface)))}
.talkpanel.tail-right .tail{right:-20px;border-left-color:var(--brand-surface);
  filter:drop-shadow(2px 0 0 color-mix(in srgb,var(--brand-ink) 16%,var(--brand-surface)))}
.talkpanel.tail-up .tail{top:-20px;border-bottom-color:var(--brand-surface);
  filter:drop-shadow(0 -2px 0 color-mix(in srgb,var(--brand-ink) 16%,var(--brand-surface)))}
.talkpanel .who{display:flex;justify-content:space-between;gap:10px;margin:0 0 8px;
  font:800 11.5px/1.3 var(--brand-font);letter-spacing:.16em;
  color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface))}
.talkpanel .who .callno{letter-spacing:.08em;font-weight:700;white-space:nowrap}
.talkpanel .say{margin:0 0 10px;font-size:15px;line-height:1.5}
.talkpanel .ask{margin:0 0 11px;font:800 15px/1.4 var(--brand-font)}
.opts{display:flex;flex-direction:column;gap:9px;margin:0}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;border:0;
  background:color-mix(in srgb,var(--brand-ink) 4%,var(--brand-surface));color:var(--brand-ink);
  border-radius:calc(var(--brand-radius) / 1.6);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 14%,var(--brand-surface));
  padding:11px 12px;font:600 15px/1.4 var(--brand-font)}
.opt .k{flex:0 0 24px;width:24px;height:24px;background:var(--brand-accent-2);color:var(--brand-ink);
  border-radius:calc(var(--brand-radius) / 4);font:900 14px/24px var(--brand-font);text-align:center}
.opt:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--brand-accent)}
.opt:disabled{cursor:default;opacity:.5}
.opt.picked{opacity:1;box-shadow:inset 0 0 0 3px var(--brand-accent)}
.opt.picked .k{background:var(--brand-accent);color:#FFFFFF}
.opt.reveal{opacity:1;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-accent) 55%,var(--brand-surface))}
/* The coworker's reply to what the learner chose. It reads as more of their
   speech, so it sits in the same bubble with only a hairline above it; the
   small tag and the clock cost are the game's one line of scorekeeping. */
.verdict{margin:12px 0 0;padding:12px 0 0;
  border-top:1px solid color-mix(in srgb,var(--brand-ink) 14%,var(--brand-surface))}
.vrow{display:flex;align-items:center;gap:8px;margin:0 0 9px;flex-wrap:wrap}
.tag{display:inline-block;padding:6px 10px;font:900 12px/1 var(--brand-font);letter-spacing:.08em;
  border-radius:calc(var(--brand-radius) / 3);color:#FFFFFF;background:var(--brand-accent)}
.tag.soft{background:color-mix(in srgb,var(--brand-accent-2) 90%,var(--brand-ink));color:var(--brand-ink)}
.tag.bad{background:color-mix(in srgb,var(--brand-ink) 78%,var(--brand-surface))}
.verdict .vtext{margin:0 0 13px;font-size:15px;line-height:1.5}
.verdict .vtext::before{content:"\201C"}
.verdict .vtext::after{content:"\201D"}

/* ---------- bottom strip ---------- */
.bottomstrip{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:9px 14px;
  font:600 14.5px/1.25 var(--brand-font);color:var(--brand-ink)}
.bottomstrip i{display:block;width:10px;height:10px;flex:none;background:var(--brand-accent);
  border-radius:calc(var(--brand-radius) / 5)}
.bottomstrip u{display:block;width:6px;height:6px;flex:none;background:var(--brand-accent-2);text-decoration:none;
  border-radius:calc(var(--brand-radius) / 6)}

/* ---------- the headline ---------- */
.endcard{justify-content:flex-start;align-items:center;padding:26px 22px;gap:0;overflow:auto;
  animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.endcard .inner{max-width:680px;width:100%;margin:auto 0}
.masthead{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:16px;
  border-bottom:3px solid var(--brand-ink)}
.masthead .rule{flex:1 1 auto;font:900 10.5px/1 var(--brand-font);letter-spacing:.3em;
  color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface))}
.masthead img{height:26px;width:auto;display:block;image-rendering:auto}
.headline{margin:0 0 10px;font:800 clamp(25px,4.1vw,42px)/1.08 var(--brand-font);letter-spacing:-.02em}
.standfirst{margin:0 0 18px;font-size:17px;line-height:1.5;
  color:color-mix(in srgb,var(--brand-ink) 74%,var(--brand-surface))}
.scorerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 18px;padding:13px 15px;
  border-radius:calc(var(--brand-radius) / 1.4);
  background:color-mix(in srgb,var(--brand-accent-2) 22%,var(--brand-surface))}
.scorerow b{font:900 26px/1 var(--brand-font);color:var(--brand-accent)}
.scorerow .of{font:700 14px/1.3 var(--brand-font)}
.endbtns{display:flex;gap:10px;flex-wrap:wrap}
.recap{list-style:none;margin:16px 0 0;padding:0}
.recap li{display:flex;gap:11px;align-items:flex-start;margin:0 0 7px;padding:9px 12px;
  border-radius:calc(var(--brand-radius) / 2);
  background:color-mix(in srgb,var(--brand-ink) 4%,var(--brand-surface));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand-ink) 12%,var(--brand-surface));
  font-size:14px;line-height:1.45}
.recap .m{flex:0 0 22px;width:22px;height:22px;text-align:center;border-radius:calc(var(--brand-radius) / 4);
  font:900 13px/22px var(--brand-font);color:#FFFFFF;background:var(--brand-accent)}
.recap li.miss .m{background:color-mix(in srgb,var(--brand-ink) 72%,var(--brand-surface))}
.recap .t b{display:block;font-weight:800}
.recap .t i{display:block;font-style:normal;color:color-mix(in srgb,var(--brand-ink) 68%,var(--brand-surface))}

@media (max-width:760px){
  .brandmark{margin-right:auto}
  .scenetitle{flex:1 1 100%;order:5}
  .dots{order:6}
}
@media (max-width:699px){
  .playrow{flex-direction:column}
  .playrow.left{flex-direction:column}
  /* on a phone the bubble sits across the bottom of the floor, tail up at
     the coworker; the floor itself stays exactly as big as it was */
  .talkpanel{position:fixed;z-index:50;width:auto;left:6px!important;right:6px;top:auto!important;bottom:6px;
    max-height:72vh}
  .talkbody{padding:11px 12px 12px}
  .verdict{margin:10px 0 0;padding:10px 0 0}
  .talkpanel .say{font-size:14px}
  .talkpanel .ask{font-size:14px}
  .opt{padding:9px 10px;font-size:14px}
}
@media (max-width:640px){
  .frame{padding:12px 12px 10px}
  .clockbox{width:92px}
  .clock{font-size:23px}
  .stage{padding:6px}
  .stage .gloss{inset:6px}
  .bottomstrip{font-size:13px;padding:9px 11px}
  .titlecard{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="frame">

  <!-- ================= title card ================= -->
  <section id="screen-title" class="screen titlecard panel" tabindex="-1">
    <div class="inner">
      <img class="logo" id="title-logo" src="brand/logo.svg" alt="">
      <p class="eyebrow" id="title-eyebrow"></p>
      <h1 id="title-h1">&nbsp;</h1>
      <p class="lede" id="title-lede">&nbsp;</p>
      <p class="goalline"><i></i><span id="title-goal"></span></p>
      <!-- How the day works, in three lines, so the learner knows the stakes
           before the first call (Rachel, 2026-09-21: "what is the goal? what
           happens if they get the question right? ... wrong?"). -->
      <ul class="howlist" id="title-how"></ul>
      <div class="namebox" id="namebox">
        <label for="learner-name" id="name-label">Your name (optional)</label>
        <div class="namerow">
          <input id="learner-name" type="text" autocomplete="off" spellcheck="false">
          <button class="btn" type="button" id="name-btn">Use this name</button>
        </div>
        <p class="hint" id="name-hint"></p>
      </div>
      <button class="btn btn-primary" type="button" id="start-btn">Let's start</button>
      <p class="hint">Walk with <span class="kbd">arrow keys</span>, talk with <span class="kbd">Enter</span>,
         answer with <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span>. Tapping works too.</p>
    </div>
  </section>

  <!-- ================= the day ================= -->
  <section id="screen-play" class="screen" tabindex="-1" hidden>
    <header class="topstrip panel">
      <div class="brandmark">
        <img id="brand-logo" src="brand/logo.svg" alt="">
        <span class="fallback" id="brand-fallback" hidden><i></i><span id="brand-line"></span></span>
      </div>
      <h1 class="scenetitle" id="scene-title">&nbsp;</h1>
      <div class="dots" id="dots" role="img" aria-label="Your five calls"></div>
      <!-- The goal, always in view: how many right so far against how many Lena
           needs (Rachel, 2026-09-21: "are the rewards and goal more obvious?"). -->
      <div class="goalchip" id="goalchip" aria-live="polite">
        <b><span id="goal-have">0</span><i>/</i><span id="goal-need">4</span></b>
        <span class="gl" id="goal-label">right calls. Lena signs you off at 4.</span>
      </div>
      <div class="clockbox">
        <div class="clock"><span id="clock">9:00</span><span class="late" id="late-chip" hidden>LATE</span></div>
        <div class="daybar" role="img" aria-label="The working day, nine to five">
          <b id="dayfill"></b><u style="left:25%"></u><u style="left:50%"></u><u style="left:75%"></u>
        </div>
      </div>
    </header>

    <div class="playrow" id="playrow">
      <div class="stagehost" id="stagehost">
        <div class="stage" id="stage">
          <canvas id="floor" role="img"
                  aria-label="A pixel office floor. You are Jo, the supervisor. Five coworkers work at their desks; when one needs you, they stand up and call you over. Lena, the shift lead, moves around the floor."></canvas>
          <span class="gloss"></span>
          <div class="floaty nametag" id="nametag" hidden></div>
          <div class="floaty prompt" id="prompt" hidden></div>
          <div class="floaty popbubble" id="popbubble" hidden></div>

          <!-- The coworker's speech bubble. It floats over the floor, anchored to the
               person who is talking, so the floor never shrinks (Rachel, 2026-09-21:
               "make it an internal popup speech bubble with multiple choice answers"). -->
          <aside class="talkpanel" id="talkpanel" hidden aria-live="polite">
            <i class="tail" id="talk-tail" aria-hidden="true"></i>
            <div class="talkbody" id="talkbody">
              <p class="who"><span id="talk-who"></span><span class="callno" id="talk-callno"></span></p>
              <h2 id="talk-heading" class="sr-only"></h2>
              <p class="say" id="talk-say"></p>
              <p class="ask" id="talk-ask"></p>
              <div class="opts" id="talk-opts" role="group" aria-labelledby="talk-heading"></div>
              <div class="verdict" id="talk-verdict" hidden>
                <p class="vrow" id="verdict-row"><span class="tag" id="verdict-tag"></span></p>
                <p class="vtext" id="verdict-text"></p>
                <button class="btn btn-primary" type="button" id="continue-btn">Continue</button>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <footer class="bottomstrip panel"><i></i><u></u><span id="hint-line">Walk to a coworker. Arrow keys or tap.</span></footer>
  </section>

  <!-- ================= the headline ================= -->
  <section id="screen-end" class="screen endcard panel" tabindex="-1" hidden>
    <div class="inner">
      <div class="masthead">
        <img id="end-logo" src="brand/logo.svg" alt="">
        <span class="rule">INTERNAL NEWSLETTER</span>
      </div>
      <h1 class="headline" id="end-headline">&nbsp;</h1>
      <p class="standfirst" id="end-standfirst">&nbsp;</p>
      <p class="scorerow"><b id="end-score">0</b><span class="of">of <span id="end-total">5</span> right calls</span></p>
      <div class="endbtns">
        <button class="btn btn-primary" type="button" id="again-btn">Play the day again</button>
      </div>
      <ol class="recap" id="recap"></ol>
    </div>
  </section>

  <p class="vh" id="footer-line"></p>
</div>

<!-- The tracker and its address. Both are optional: with no endpoint in
     config.js nothing is sent and the day behaves exactly the same. -->
<script src="track.js"></script>
<script src="config.js"></script>
<!-- The scenario itself. This is the only file the skill writes. -->
<script src="scenario.js"></script>
<script>
/* ==================================================================
   ENGINE.
   Content lives in scenario.js, brand in brand/brand.css. Nothing below
   names a decision, a choice, a consequence or a colour.
   ================================================================== */
var CONTENT   = window.SCENARIO || {};
var DECISIONS = CONTENT.decisions || [];
var ART       = CONTENT.art || {};
var GOAL      = CONTENT.goal || {};
var FINISH    = CONTENT.finish || {};
var BRAND_DIR = window.BRAND_DIR || "brand/";
var COURSE_VERSION = "v1";
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function byId(id){ return document.getElementById(id); }
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls){ n.className = cls; }
  if (text != null){ n.textContent = text; }
  return n;
}

/* ---------- course events, in the kit's four shapes ---------- */
var EVENTS = [];
var trackingOn = false;
function post(event, data){
  try{ window.parent.postMessage({ type:"course", event:event, data:data || {} }, "*"); }catch(e){}
}
function log(event, data){
  try{ if (trackingOn && window.EMTrack){ window.EMTrack.logCourseEvent(event, data || {}); } }catch(e){}
}
function send(event, data){
  EVENTS.push({ event:event, data:data || {} });
  post(event, data);
  log(event, data);
}

(function(){
  if (typeof window.EMTrack === "undefined"){ return; }
  var cfg = window.ACTIVITY || {};
  var endpoint = String(cfg.endpoint || "");
  var key = String(cfg.key || "");
  if (endpoint){
    trackingOn = true;
    window.EMTrack.init({ endpoint:endpoint, key:key || undefined, courseId: cfg.id || CONTENT.id });
  }
})();

/* ==================================================================
   THE BRAND, READ OUT OF CSS
   The canvas cannot use a CSS variable, so it asks the page for the
   computed value. Resolving it through a probe element means any legal
   colour notation works, not only hex.
   ================================================================== */
var probe = document.createElement("span");
probe.setAttribute("aria-hidden", "true");
probe.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
document.body.appendChild(probe);

function rgbOf(value, fallback){
  probe.style.color = "";
  probe.style.color = value;
  var m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/.exec(window.getComputedStyle(probe).color);
  if (!m){ return fallback; }
  return [Math.round(+m[1]), Math.round(+m[2]), Math.round(+m[3])];
}
function brandColour(name, fallback){
  var v = window.getComputedStyle(document.documentElement).getPropertyValue(name);
  return rgbOf((v || "").trim() || fallback, rgbOf(fallback, [0, 0, 0]));
}
function css(c){ return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
function mix(c, to, t){
  return [Math.round(c[0] + (to[0] - c[0]) * t),
          Math.round(c[1] + (to[1] - c[1]) * t),
          Math.round(c[2] + (to[2] - c[2]) * t)];
}
var WHITE = [255, 255, 255], BLACK = [0, 0, 0];

var PAINT = {};
var accentKey = "";   /* which accent the furniture layer was tinted for */
function readBrand(){
  var accent  = brandColour("--brand-accent",   "#FF7366");
  var accent2 = brandColour("--brand-accent-2", "#ffc53d");
  var surface = brandColour("--brand-surface",  "#ffffff");
  var ink     = brandColour("--brand-ink",      "#17191c");
  PAINT = {
    accent:   css(accent),
    accent2:  css(accent2),
    accentHi: css(mix(accent, WHITE, 0.26)),
    accentLo: css(mix(accent, BLACK, 0.24)),
    surface:  css(surface),
    inkSoft:  css(mix(ink, WHITE, 0.28)),
    onAccent: "#FFFFFF"                     /* the kit checked this at AA */
  };
  accentKey = PAINT.accent + "|" + PAINT.accent2;
}
readBrand();
byId("brand-link").addEventListener("load", readBrand);
window.addEventListener("load", readBrand);

/* ==================================================================
   THE WORLD
   1120 x 760 world units. The floor art is a 2x render of that grid.

   VIEW is the part of it we show. The rendered floor carries a dark
   charcoal bezel around the room — measured, not guessed: 39 units left
   and right, 7 on top, 34 at the bottom. We look past it, so the office
   sits straight on the brand's own surface panel. Everyone's
   coordinates stay in the full 1120x760 grid.
   ================================================================== */
var WORLD  = { w:1120, h:760 };
var VIEW   = { x:39, y:7, w:1042, h:719 };
var BOUNDS = { x0:48, x1:1072, y0:105, y1:718 };
var SOLIDS = [
  /* desks */
  {x:92,y:182,w:186,h:62},{x:370,y:182,w:180,h:62},{x:654,y:182,w:180,h:62},{x:918,y:182,w:116,h:62},
  {x:90,y:451,w:180,h:65},{x:860,y:456,w:164,h:60},{x:437,y:458,w:246,h:95},
  /* dividers */
  {x:315,y:95,w:12,h:192},{x:589,y:95,w:12,h:192},{x:869,y:95,w:12,h:192},
  {x:48,y:379,w:266,h:12},{x:805,y:379,w:267,h:12},
  {x:325,y:454,w:12,h:133},{x:779,y:454,w:12,h:133},
  /* small furniture */
  {x:92,y:392,w:52,h:40},{x:156,y:630,w:52,h:48},{x:657,y:622,w:38,h:54},{x:734,y:622,w:38,h:54}
];

/* The office keeps its own colours. The one thing that wears the brand
   is the furniture: art/office-accents.png is a grey, alpha-masked copy
   of exactly the chair, monitor and divider pixels, and a second layer
   holds the armchairs, the shelved books and the desk pips. The floor
   underneath has both sets in neutral grey, so tinting each layer and
   laying it back on puts the client's two accents on the furniture and
   nothing else. */
var ACCENT_LAYERS = [
  { key:"accents",  src:"art/office-accents.png",   paint:"accent"  },
  { key:"accents2", src:"art/office-accents-2.png", paint:"accent2" }
];

/* Sprite strips: 16 frames of 64x80 in one row.
   0-3 down, 4-7 left, 8-11 right, 12-15 up; within a direction the
   order is stand, stepL, stand2, stepR. Feet sit at y=76 in the frame. */
var FRAME_W = 64, FRAME_H = 80, FEET_Y = 76;
var FACE = { down:0, left:4, right:8, up:12 };
var WALK_CYCLE = [0, 1, 2, 3];          /* stand, stepL, stand2, stepR */
var SPEED = 220;                        /* world units per second */
var LENA_SPEED = 240;                   /* the shift lead walks a little briskly: she has somewhere to be */
var HALF = 13, FOOT = 12;               /* Jo's feet box */
var TALK_RANGE = 56;

/* Who is on the floor. x,y is where the feet are; home is where they
   belong. `call` is the index of the decision that person carries. */
var JO = { id:"jo", name:"Jo", role:"you, supervisor", x:560, y:665, face:"up", call:-1 };
/* x,y is where each coworker stands when they call the learner over;
   `chair` is their desk chair in the floor art (world units, measured from
   the chair shapes in art/office-accents.png). They spend the day sitting
   in it, working (Rachel, 2026-09-27: "no one is sitting at their desk").
   Maya has the fourth desk; the break room is where people get coffee. */
var CAST = [
  { id:"priya",  name:"Priya",  role:"forklift bay", x:191, y:294, face:"down", call:0, chair:{ x:177.5, y:236,   w:27,   h:41 } },
  { id:"theo",   name:"Theo",   role:"picking",      x:462, y:294, face:"down", call:1, chair:{ x:447.5, y:235.5, w:29,   h:40.5 } },
  { id:"marcus", name:"Marcus", role:"nights",       x:741, y:294, face:"down", call:2, chair:{ x:727,   y:235.5, w:28,   h:41.5 } },
  { id:"maya",   name:"Maya",   role:"inbound",      x:969, y:294, face:"down", call:3, chair:{ x:955,   y:236,   w:28,   h:41 } },
  { id:"owen",   name:"Owen",   role:"dispatch",     x:936, y:560, face:"down", call:4, chair:{ x:922.5, y:508,   w:27.5, h:41.5 } },
  { id:"lena",   name:"Lena",   role:"shift lead",   x:560, y:592, face:"down", call:-1 }
];
var PEOPLE = [JO].concat(CAST);
var LENA = CAST[5];
/* OPTIONAL: scenario.js may rename the people on the floor so the game fits
   any topic. `people.lead` is the person a learner escalates to (default
   Lena, shift lead); `people.coworkers` names the five who bring the calls,
   in decision order. The art stays the same; only names and roles change. */
(function(){
  var P = (window.SCENARIO && window.SCENARIO.people) || {};
  if (P.lead){ if (P.lead.name){ LENA.name = P.lead.name; } if (P.lead.role){ LENA.role = P.lead.role; } }
  (P.coworkers || []).forEach(function(c, i){
    var who = personFor(i);
    if (who && c){ if (c.name){ who.name = c.name; } if (c.role){ who.role = c.role; } }
  });
  var cv = document.querySelector("canvas[aria-label]");
  if (cv){ cv.setAttribute("aria-label", "A pixel office floor. You are the supervisor. Five coworkers work at their desks; when one needs you, they stand up and call you over. " + LENA.name + ", the " + LENA.role + ", moves around the floor."); }
})();
PEOPLE.forEach(function(p){
  p.anim = null; p.job = null;
  if (p.chair){
    /* seated: the neck sits on the top of the chair back */
    p.stand = { x:p.x, y:p.y };
    p.seat  = { x:p.chair.x + p.chair.w / 2, y:p.chair.y + 40 };
    p.x = p.seat.x; p.y = p.seat.y; p.face = "up"; p.sitting = true;
  }
  p.home = { x:p.x, y:p.y, face:p.face };
  p.status = p.call >= 0 ? "idle" : "lead";
});

function personFor(i){
  for (var n = 0; n < CAST.length; n++){ if (CAST[n].call === i){ return CAST[n]; } }
  return null;
}

/* ==================================================================
   ART LOADING
   ================================================================== */
var IMAGES = {};
function loadImage(name, src){
  var img = new Image();
  img.decoding = "sync";
  img.src = src;
  IMAGES[name] = img;
  return img;
}
loadImage("floor", "art/office-floor.webp");
ACCENT_LAYERS.forEach(function(L){ loadImage(L.key, L.src); });
PEOPLE.forEach(function(p){ loadImage(p.id, "art/" + p.id + "-walk.png"); });

/* ==================================================================
   THE DAY
   ================================================================== */
var DAY_MINUTES = 480;                  /* 9:00 to 5:00 */
var COST = { good:0, soft:30, bad:60 };
var mode = "title";                     /* title | play | talk | beat | end */
var minutes = 0;                        /* game minutes spent */
var shownMin = 0;                       /* what the clock is displaying */
var clockFrom = 0, clockTo = 0, clockAt = 0;
var chosen = {};                        /* decision id -> {key,right,text,tone} */
var talking = null;                     /* the person we are talking to */
var talkIndex = -1;
var answered = false;
var completedSent = false;

function clockText(min){
  var t = 9 * 60 + Math.round(min);
  var h = Math.floor(t / 60), m = t % 60;
  var pm = h >= 12;
  var hh = h > 12 ? h - 12 : h;
  return hh + ":" + (m < 10 ? "0" : "") + m + (pm ? " PM" : "");
}
function toneOf(c){
  return (c.tone === "good" || c.tone === "soft" || c.tone === "bad") ? c.tone : (c.right ? "good" : "bad");
}
function rightChoice(def){
  var list = def.choices || [];
  for (var i = 0; i < list.length; i++){ if (list[i].right){ return list[i]; } }
  return list[0] || { key:"", text:"" };
}
function scoreNow(){
  var right = 0;
  DECISIONS.forEach(function(d){ if (chosen[d.id] && chosen[d.id].right){ right++; } });
  var total = DECISIONS.length || 1;
  return { right:right, total:total, percent:Math.round(right / total * 100) };
}
function handledCount(){
  var n = 0;
  DECISIONS.forEach(function(d){ if (chosen[d.id]){ n++; } });
  return n;
}

/* ==================================================================
   FITTING AND THE CAMERA
   Desktop shows the whole office. Under 700px the floor zooms to 1.6x
   and the camera follows Jo, clamped so it never leaves the room.
   ================================================================== */
var cv = byId("floor");
var g  = cv.getContext("2d", { alpha:true });
var K = 1;         /* world units -> css pixels */
var S = 1;         /* world units -> canvas backing pixels */
var ZOOM = 1;
var cam = { x:VIEW.x, y:VIEW.y, w:VIEW.w, h:VIEW.h };

function isPhone(){ return window.matchMedia("(max-width:699px)").matches; }

function fit(){
  var host = byId("stagehost");
  var pad = (parseFloat(window.getComputedStyle(byId("stage")).paddingLeft) || 0) * 2;
  var availW = Math.max(120, host.clientWidth  - pad);
  var availH = Math.max(90,  host.clientHeight - pad);
  var k = Math.min(availW / VIEW.w, availH / VIEW.h);
  k = Math.max(0.0625, Math.floor(k * 16) / 16);
  var cssW = Math.round(VIEW.w * k), cssH = Math.round(VIEW.h * k);
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.style.width  = cssW + "px";
  cv.style.height = cssH + "px";
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  ZOOM = isPhone() ? 1.6 : 1;
  K = (cssW / VIEW.w) * ZOOM;
  S = (cv.width / VIEW.w) * ZOOM;
  cam.w = cssW / K;
  cam.h = cssH / K;
  aimCamera(true);
}

function aimCamera(){
  if (cam.w >= VIEW.w){ cam.x = VIEW.x + (VIEW.w - cam.w) / 2; }
  else { cam.x = Math.min(Math.max(JO.x - cam.w / 2, VIEW.x), VIEW.x + VIEW.w - cam.w); }
  if (cam.h >= VIEW.h){ cam.y = VIEW.y + (VIEW.h - cam.h) / 2; }
  else { cam.y = Math.min(Math.max(JO.y - cam.h / 2, VIEW.y), VIEW.y + VIEW.h - cam.h); }
}
function screenX(wx){ return cv.offsetLeft + (wx - cam.x) * K; }
function screenY(wy){ return cv.offsetTop  + (wy - cam.y) * K; }

/* ==================================================================
   WALKING
   ================================================================== */
var keys = {};
var target = null;          /* click-to-walk destination */
var route = [];             /* corner points to get round a desk on the way */
var tries = 0;
var pendingTalk = null;     /* whom to talk to when we get there */

function clearRoute(){ target = null; route = []; tries = 0; }

/* A desk in the way. Rather than stopping dead, aim at the corner that
   clears it and carry on from there. Jo still only walks in straight
   lines; this just decides which straight line. */
function planAround(dx, dy){
  var final = target;
  var ay = blockingSolid(JO.x, JO.y + dy);
  var ax = blockingSolid(JO.x + dx, JO.y);
  if (++tries > 6 || !final){ clearRoute(); pendingTalk = null; JO.moving = false; return; }
  if (ay){
    var left = ay.x - HALF - 10, right = ay.x + ay.w + HALF + 10;
    var okL = left > BOUNDS.x0, okR = right < BOUNDS.x1;
    var ex = (okL && (!okR || Math.abs(JO.x - left) <= Math.abs(JO.x - right))) ? left : right;
    route = [{ x:ex, y:JO.y }, { x:ex, y:final.y }];
  } else if (ax){
    var up = ax.y - 10, down = ax.y + ax.h + FOOT + 10;
    var okU = up > BOUNDS.y0, okD = down < BOUNDS.y1;
    var ey = (okU && (!okD || Math.abs(JO.y - up) <= Math.abs(JO.y - down))) ? up : down;
    route = [{ x:JO.x, y:ey }, { x:final.x, y:ey }];
  } else { clearRoute(); pendingTalk = null; JO.moving = false; }
}

function hitsSolid(x, y){
  var l = x - HALF, r = x + HALF, t = y - FOOT, b = y;
  if (l < BOUNDS.x0 || r > BOUNDS.x1 || y < BOUNDS.y0 || y > BOUNDS.y1){ return true; }
  for (var i = 0; i < SOLIDS.length; i++){
    var s = SOLIDS[i];
    if (l < s.x + s.w && r > s.x && t < s.y + s.h && b > s.y){ return true; }
  }
  return false;
}
function blockingSolid(x, y){
  var l = x - HALF, r = x + HALF, t = y - FOOT, b = y;
  for (var i = 0; i < SOLIDS.length; i++){
    var s = SOLIDS[i];
    if (l < s.x + s.w && r > s.x && t < s.y + s.h && b > s.y){ return s; }
  }
  return null;
}
function stepAxis(p, dx, dy){
  if (dx && !hitsSolid(p.x + dx, p.y)){ p.x += dx; }
  if (dy && !hitsSolid(p.x, p.y + dy)){ p.y += dy; }
}
function faceFor(dx, dy){
  if (Math.abs(dx) > Math.abs(dy)){ return dx < 0 ? "left" : "right"; }
  return dy < 0 ? "up" : "down";
}

function walkInput(dt){
  var dx = 0, dy = 0;
  if (keys.left){ dx -= 1; }
  if (keys.right){ dx += 1; }
  if (keys.up){ dy -= 1; }
  if (keys.down){ dy += 1; }

  if (dx || dy){
    clearRoute(); pendingTalk = null;
    var len = Math.sqrt(dx * dx + dy * dy);
    dx = dx / len * SPEED * dt;
    dy = dy / len * SPEED * dt;
    JO.face = faceFor(dx, dy);
    JO.moving = true;
    stepAxis(JO, dx, dy);
    return;
  }

  if (target){
    var goal = route.length ? route[0] : target;
    var tx = goal.x - JO.x, ty = goal.y - JO.y;
    var d = Math.sqrt(tx * tx + ty * ty);
    if (d < (route.length ? 3 : 6)){
      if (route.length){ route.shift(); return; }
      clearRoute();
      JO.moving = false;
      if (pendingTalk){ var who = pendingTalk; pendingTalk = null; openTalk(who); }
      return;
    }
    var step = SPEED * dt, mx = tx / d, my = ty / d;
    var px = JO.x, py = JO.y;
    JO.face = faceFor(mx, my);
    JO.moving = true;
    stepAxis(JO, mx * step, my * step);
    if (Math.sqrt((JO.x - px) * (JO.x - px) + (JO.y - py) * (JO.y - py)) < step * 0.3){
      planAround(mx * step, my * step);
    }
    return;
  }
  JO.moving = false;
}

function nearestOpen(){
  var best = null, bestD = TALK_RANGE;
  for (var i = 0; i < CAST.length; i++){
    var p = CAST[i];
    if (p.call < 0 || p.status !== "open"){ continue; }
    var d = Math.sqrt((p.x - JO.x) * (p.x - JO.x) + (p.y - JO.y) * (p.y - JO.y));
    if (d <= bestD){ bestD = d; best = p; }
  }
  return best;
}

/* ==================================================================
   ROUTES
   A coarse grid over the open floor and a breadth-first search, so Lena
   walks round desks and dividers all the way to the learner and back
   (Rachel, 2026-09-27: she "only came half way", and it was not clear
   she was talking).
   ================================================================== */
var CELL = 16;
var GCOLS = Math.floor((BOUNDS.x1 - BOUNDS.x0) / CELL);
var GROWS = Math.floor((BOUNDS.y1 - BOUNDS.y0) / CELL);
var openCells = null;
function cellX(c){ return BOUNDS.x0 + c * CELL + CELL / 2; }
function cellY(r){ return BOUNDS.y0 + r * CELL + CELL / 2; }
function cellAt(x, y){
  var c = Math.min(GCOLS - 1, Math.max(0, Math.round((x - BOUNDS.x0 - CELL / 2) / CELL)));
  var r = Math.min(GROWS - 1, Math.max(0, Math.round((y - BOUNDS.y0 - CELL / 2) / CELL)));
  return r * GCOLS + c;
}
/* Every open cell reachable from p, scored by score(x, y) plus the length
   of the walk; returns the corner points of the walk to the best one.
   score returns Infinity for a cell that will not do. */
function routeFor(p, score){
  if (!openCells){
    openCells = [];
    for (var r0 = 0; r0 < GROWS; r0++){
      for (var c0 = 0; c0 < GCOLS; c0++){ openCells.push(!hitsSolid(cellX(c0), cellY(r0))); }
    }
  }
  var n = GCOLS * GROWS, start = cellAt(p.x, p.y);
  var prev = new Int32Array(n), steps = new Int32Array(n);
  for (var k = 0; k < n; k++){ prev[k] = -2; }
  prev[start] = -1;
  var queue = [start], best = -1, bestS = Infinity;
  for (var h = 0; h < queue.length; h++){
    var i = queue[h], c = i % GCOLS, r = (i - c) / GCOLS;
    var sc = score(cellX(c), cellY(r)) + steps[i] * CELL;
    if (sc < bestS){ bestS = sc; best = i; }
    var next = [c > 0 ? i - 1 : -1, c < GCOLS - 1 ? i + 1 : -1, r > 0 ? i - GCOLS : -1, r < GROWS - 1 ? i + GCOLS : -1];
    for (var m = 0; m < 4; m++){
      var j = next[m];
      if (j < 0 || prev[j] !== -2 || !openCells[j]){ continue; }
      prev[j] = i; steps[j] = steps[i] + 1; queue.push(j);
    }
  }
  if (best < 0){ return []; }
  var cells = [];
  for (var at = best; at >= 0; at = prev[at]){ cells.unshift(at); }
  var pts = cells.map(function(q){ var cc = q % GCOLS; return { x:cellX(cc), y:cellY((q - cc) / GCOLS) }; });
  /* keep only the corners */
  var out = [];
  for (var t = 0; t < pts.length; t++){
    var a0 = pts[t - 1], b0 = pts[t], z0 = pts[t + 1];
    if (!a0 || !z0 || (a0.x === b0.x) !== (b0.x === z0.x)){ out.push(b0); }
  }
  return out;
}
function standsClear(x, y, who){
  for (var i = 0; i < PEOPLE.length; i++){
    var q = PEOPLE[i];
    if (q === who || q === JO){ continue; }
    if (Math.abs(q.x - x) < 40 && Math.abs(q.y - y) < 30){ return false; }
  }
  return true;
}
/* Walk p along a route, then call done. */
function walkRoute(p, path, done, speed){
  p.sitting = false;
  p.anim = { kind:"walk", t0:now, path:path, speed:speed || LENA_SPEED, done:done || null };
}
function routeToSpot(p, x, y){
  var path = routeFor(p, function(cx, cy){ return Math.hypot(cx - x, cy - y) * 10; });
  path.push({ x:x, y:y });
  return path;
}

/* ==================================================================
   THE BUSY OFFICE
   Everyone works at their desk. Requests come in one at a time: the
   next coworker stands up and calls the learner over, and when the call
   is done they sit back down. In between, people get coffee, browse the
   shelves, chat in the corridor, and Lena does her rounds (Rachel,
   2026-09-27: "all the questions are showing the question block at the
   same time, all waiting patiently ... not very dynamic for a busy office").
   ================================================================== */
var timers = [];
function after(ms, fn){ timers.push({ at:now + ms, fn:fn }); }
function runTimers(){
  for (var i = timers.length - 1; i >= 0; i--){
    if (i < timers.length && now >= timers[i].at){ var f = timers[i].fn; timers.splice(i, 1); f(); }
  }
}
var STROLL = 150;
var CALLOUTS = ["Jo, got a sec?", "Jo! Over here.", "Jo, can you come over?", "Jo, have you got a minute?", "Jo! Quick one."];
var ringAt = 0, errandAt = 0, lastCaller = null;
var SPOTS = [
  { x:150, y:548, face:"up",   says:"\u2615" },          /* the coffee table */
  { x:215, y:548, face:"up",   says:"\u2615" },
  { x:182, y:700, face:"up",   says:"" },                 /* the bookshelf */
  { x:714, y:700, face:"up",   says:"" },                 /* the lounge */
  { x:330, y:330, face:"right", says:"" },                /* the corridor */
  { x:820, y:330, face:"left",  says:"" }
];
function nextCallIndex(){
  for (var i = 0; i < DECISIONS.length; i++){ if (!chosen[DECISIONS[i].id]){ return i; } }
  return -1;
}
function someoneCalling(){
  for (var i = 0; i < CAST.length; i++){ if (CAST[i].status === "open" || CAST[i].status === "calling"){ return true; } }
  return false;
}
function sitDown(p){
  var job = p.job = {};
  var path = routeToSpot(p, p.stand.x, p.stand.y);
  path.push({ x:p.seat.x, y:p.seat.y });
  walkRoute(p, path, function(){
    if (p.job !== job){ return; }
    p.job = null; p.sitting = true; p.face = "up"; p.moving = false;
  }, STROLL);
}
/* The next request lands: that coworker gets up, steps out from the desk
   and calls the learner over. */
function ring(p){
  var job = p.job = {};
  p.status = "calling";
  walkRoute(p, routeToSpot(p, p.stand.x, p.stand.y), function(){
    if (p.job !== job){ return; }
    p.job = null;
    p.face = faceFor(JO.x - p.x, JO.y - p.y);
    if (p.face === "up"){ p.face = "down"; }
    p.status = "open"; p.openAt = now; p.waited = 0; p.patience = 1; p.ranOut = false;
    p.anim = { kind:"bob", t0:now, dur:700 };
    popBubble(p, personalize(CALLOUTS[p.call % CALLOUTS.length]), false, 2200);
    if (mode === "play"){ byId("hint-line").textContent = p.name + " needs you. Walk over, or tap " + p.name + "."; }
  }, 190);
}
function startErrand(){
  var next = personFor(nextCallIndex());
  var out = 0, free = [], i;
  for (i = 0; i < CAST.length; i++){ if (CAST[i].errand){ out++; } }
  if (out >= 2){ return; }
  for (i = 0; i < CAST.length; i++){
    var q = CAST[i];
    if (q === LENA || !q.sitting || q.job || q.anim || q === next || q === talking || q === lastCaller){ continue; }
    if (q.status === "open" || q.status === "calling"){ continue; }
    free.push(q);
  }
  var lenaFree = mode === "play" && !leadPending && talking !== LENA && !LENA.anim && !LENA.job && !LENA.errand;
  if (lenaFree && (Math.random() < 0.35 || !free.length)){ lenaRound(); return; }
  if (!free.length){ return; }
  var who = free[Math.floor(Math.random() * free.length)];
  var spots = SPOTS.filter(function(sp){ return !sp.taken; });
  if (!spots.length){ return; }
  var spot = spots[Math.floor(Math.random() * spots.length)];
  var job = who.job = {};
  spot.taken = true; who.errand = spot;
  walkRoute(who, routeToSpot(who, spot.x, spot.y), function(){
    if (who.job !== job){ spot.taken = false; who.errand = null; return; }
    who.face = spot.face; who.moving = false;
    if (spot.says){ popBubble(who, spot.says, false, 1400); }
    after(2500 + Math.random() * 2500, function(){
      spot.taken = false; who.errand = null;
      if (who.job !== job){ return; }
      sitDown(who);
    });
  }, STROLL);
}
/* Lena checks in beside someone's desk, or looks over the big table. */
function lenaRound(){
  var spots = [{ x:470, y:600, face:"up" }, { x:650, y:600, face:"up" }, { x:560, y:330, face:"up" }];
  CAST.forEach(function(q){ if (q.stand && q.sitting){ spots.push({ x:q.stand.x + 36, y:q.stand.y, face:"left" }); } });
  var spot = spots[Math.floor(Math.random() * spots.length)];
  var job = LENA.job = {};
  LENA.errand = spot;
  walkRoute(LENA, routeToSpot(LENA, spot.x, spot.y), function(){
    if (LENA.job !== job){ LENA.errand = null; return; }
    LENA.face = spot.face; LENA.moving = false;
    after(2200 + Math.random() * 2000, function(){
      LENA.errand = null;
      if (LENA.job !== job){ return; }
      LENA.job = null;
      if (talking === LENA || leadPending){ return; }
      lenaGoesHome();
    });
  }, STROLL);
}
var PATIENCE_MS = 20000, NUDGE_MS = 7000, WAIT_COST = 10;
function officeLife(dt){
  runTimers();
  if (mode === "title" || mode === "end"){ return; }
  /* the next request, once the last one is done */
  if (mode === "play" && !talking && !someoneCalling() && nextCallIndex() >= 0){
    if (!ringAt){ ringAt = now + (handledCount() === 0 ? 1200 : 2400); }
    else if (now >= ringAt){ ringAt = 0; var nextP = personFor(nextCallIndex()); if (nextP){ ring(nextP); } }
  } else { ringAt = 0; }
  /* patience drains while the learner keeps them waiting */
  for (var i = 0; i < CAST.length; i++){
    var q = CAST[i];
    if (!(mode === "play" && q.status === "open")){ continue; }
    q.waited = (q.waited || 0) + dt * 1000;
    q.patience = Math.max(0, 1 - q.waited / PATIENCE_MS);
    if (q.patience <= 0 && !q.ranOut){
      q.ranOut = true;
      minutes += WAIT_COST;
      clockFrom = shownMin; clockTo = minutes; clockAt = now;
      q.anim = { kind:"shrug", t0:now, dur:900 };
      popBubble(q, personalize("Jo, I've been waiting ages!"), true, 2200);
      byId("hint-line").textContent = q.name + " waited too long.";
      q.openAt = now;
    } else if (now - q.openAt > NUDGE_MS){
      q.openAt = now; q.anim = { kind:"bob", t0:now, dur:700 };
      popBubble(q, personalize(q.patience > 0.5 ? "Jo? Over here!" : "Jo, it's getting busy here!"), false, 1800);
    }
  }
  /* someone always has somewhere to be */
  if (!errandAt){ errandAt = now + 2500 + Math.random() * 3500; }
  else if (now >= errandAt){ errandAt = 0; startErrand(); }
}

/* A wrong call: after the coworker has answered, Lena walks all the way
   over, stands beside the learner, faces them, and says her piece in her
   own speech bubble. */
var leadPending = null;                 /* what Lena will say, once the coworker's reply is read */
function lenaComesOver(line){
  LENA.job = null; LENA.errand = null;
  byId("talkpanel").hidden = true;
  mode = "react";
  byId("hint-line").textContent = LENA.name + " is coming over.";
  var path = routeFor(LENA, function(x, y){
    var dx = x - JO.x, dy = y - JO.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 34 || d > 64 || !standsClear(x, y, LENA)){ return Infinity; }
    return Math.abs(dy) * 1.5;           /* side by side reads best */
  });
  if (!path.length){
    path = routeFor(LENA, function(x, y){ return Math.hypot(x - JO.x, y - JO.y) * 4; });
  }
  walkRoute(LENA, path, function(){
    LENA.face = faceFor(JO.x - LENA.x, JO.y - LENA.y);
    JO.face = faceFor(LENA.x - JO.x, LENA.y - JO.y);
    showLeadLine(line);
  });
}
function lenaGoesHome(){
  var home = LENA.home;
  var path = routeFor(LENA, function(x, y){ return Math.hypot(x - home.x, y - home.y) * 10; });
  path.push({ x:home.x, y:home.y });
  walkRoute(LENA, path, function(){ LENA.face = home.face; });
}
function showLeadLine(line){
  talking = LENA;
  byId("talk-who").textContent = (LENA.name + ", " + LENA.role).toUpperCase();
  byId("verdict-row").hidden = true;
  byId("verdict-text").textContent = personalize(line);
  showReply();
}

/* ==================================================================
   REACTIONS
   Small scripted beats on the existing walk strips. No new art.
   ================================================================== */
var sparkles = [];
function react(p, tone){
  if (tone === "good"){
    p.anim = { kind:"bob", t0:now, dur:600 };
    sparkles.push({ x:p.x, y:p.y - FRAME_H - 10, t0:now, dur:500 });
    popBubble(p, "✓", false, 600);
    /* Lena notices a right call from her desk; on the one that meets the
       goal she says so, so the reward is seen where the goal lives */
    var r = scoreNow().right;
    setTimeout(function(){
      popBubble(LENA, r >= NEED ? "That's " + NEED + ". You're signed off." : "Nice.", false, r >= NEED ? 2200 : 1100);
    }, 650);
  } else if (tone === "soft"){
    p.anim = { kind:"shrug", t0:now, dur:900 };
    popBubble(p, "…", false, 800);
  } else {
    p.anim = { kind:"storm", t0:now, dur:1600 };
    popBubble(p, "?!", true, 1200);
    /* Lena comes over after the coworker has answered: see lenaComesOver() */
  }
}

/* A small sign that stays over a coworker's desk for the rest of the day,
   saying what the office looks like after that call. Wrong calls leave a
   dark sign, near misses an amber one, right calls a plain one with a tick.
   (Rachel, 2026-09-21: "can we see a small consequence for the wrong scenario?") */
function setSign(p, text, tone){
  var id = "sign-" + p.id;
  var el0 = byId(id);
  if (!el0){
    el0 = document.createElement("div");
    el0.id = id;
    byId("stage").appendChild(el0);
  }
  el0.className = "floaty signtag " + tone;
  el0.textContent = (tone === "good" ? "✓ " : tone === "soft" ? "… " : "✗ ") + text;
  el0.hidden = false;
  p.sign = text;
}
function clearSigns(){
  for (var i = 0; i < PEOPLE.length; i++){
    PEOPLE[i].sign = null;
    var e = byId("sign-" + PEOPLE[i].id);
    if (e){ e.remove(); }
  }
}
function placeSigns(){
  for (var i = 0; i < PEOPLE.length; i++){
    var p = PEOPLE[i];
    if (!p.sign){ continue; }
    var e = byId("sign-" + p.id);
    var at = p.seat || p;
    if (e){ place(e, at.x, at.y - FRAME_H - 16); }
  }
}

var popTimer = null;
function popBubble(p, text, bad, ms){
  var b = byId("popbubble");
  b.textContent = text;
  b.className = "floaty popbubble" + (bad ? " bad" : "");
  b.dataset.who = p.id;
  b.hidden = false;
  clearTimeout(popTimer);
  popTimer = setTimeout(function(){ b.hidden = true; }, ms);
}

function runAnim(p, dt){
  var a = p.anim;
  if (!a){ return; }
  var since = now - a.t0;

  if (a.kind === "bob" || a.kind === "shrug"){
    if (since > a.dur){ p.anim = null; }
    return;                                   /* the frame picker reads a.kind */
  }

  if (a.kind === "storm"){
    /* a wrong call: the coworker turns their back and gets on with it,
       then turns round again. The old lunge down and back read as a glitch
       (Rachel, 2026-09-21: "the NPC stepped forward and back"). */
    if (since < a.dur){
      p.face = "up"; p.moving = false;
    } else {
      p.face = faceFor(JO.x - p.x, JO.y - p.y); p.moving = false; p.anim = null;
    }
    return;
  }

  if (a.kind === "walk"){
    /* follow the corner points of a route (see routeFor). The route is on
       open floor already, so no collision test is needed on the way. */
    var wp = a.path[0];
    if (!wp || since > 12000){
      var end = a.path[a.path.length - 1];
      if (end){ p.x = end.x; p.y = end.y; }
      p.moving = false; p.anim = null;
      if (a.done){ a.done(); }
      return;
    }
    var wx = wp.x - p.x, wy = wp.y - p.y, wd = Math.sqrt(wx * wx + wy * wy);
    var st = a.speed * dt;
    p.moving = true;
    if (wd <= st){ p.x = wp.x; p.y = wp.y; a.path.shift(); return; }
    p.face = faceFor(wx, wy);
    p.x += wx / wd * st; p.y += wy / wd * st;
    return;
  }
}

/* ==================================================================
   DRAWING
   ================================================================== */
/* An image is only safe to composite once it has finished decoding.
   Half-decoded, drawImage silently draws nothing, the multiply fill
   floods the whole layer and destination-in has no mask to trim it
   with — a solid slab of accent where the office should be. Worse, the
   result would be cached. So: nothing is built until everything is in. */
function ready(img){ return !!(img && img.complete && img.naturalWidth > 0); }

var tintCache = {};
function tintedLayer(L){
  var src = IMAGES[L.key];
  if (!ready(src)){ return null; }
  var slot = tintCache[L.key];
  if (slot && slot.key === accentKey){ return slot.canvas; }
  if (!slot){
    slot = tintCache[L.key] = { canvas:document.createElement("canvas"), key:"" };
    slot.canvas.width = src.naturalWidth;
    slot.canvas.height = src.naturalHeight;
  }
  var t = slot.canvas.getContext("2d");
  t.setTransform(1, 0, 0, 1, 0, 0);
  t.globalCompositeOperation = "source-over";
  t.clearRect(0, 0, slot.canvas.width, slot.canvas.height);
  t.drawImage(src, 0, 0);
  t.globalCompositeOperation = "multiply";
  t.fillStyle = PAINT[L.paint];
  t.fillRect(0, 0, slot.canvas.width, slot.canvas.height);
  t.globalCompositeOperation = "destination-in";
  t.drawImage(src, 0, 0);
  t.globalCompositeOperation = "source-over";
  slot.key = accentKey;
  return slot.canvas;
}
/* The floor and its two tinted layers are three 2240x1520 images. Scaling
   all three down every frame costs more than the whole rest of the game,
   so they are composed once, at exactly the size they will be shown, and
   the result is blitted 1:1 until the scale or the brand changes. */
var room = null, roomKey = "";
function roomImage(){
  var floor = IMAGES.floor;
  if (!ready(floor)){ return null; }
  for (var n = 0; n < ACCENT_LAYERS.length; n++){
    if (!ready(IMAGES[ACCENT_LAYERS[n].key])){ return null; }
  }
  var key = S.toFixed(4) + "|" + accentKey;
  if (room && roomKey === key){ return room; }
  if (!room){ room = document.createElement("canvas"); }
  room.width  = Math.max(1, Math.ceil(WORLD.w * S));
  room.height = Math.max(1, Math.ceil(WORLD.h * S));
  var r = room.getContext("2d");
  r.setTransform(1, 0, 0, 1, 0, 0);
  r.clearRect(0, 0, room.width, room.height);
  r.imageSmoothingEnabled = (S < 1);
  r.imageSmoothingQuality = "high";
  r.drawImage(floor, 0, 0, room.width, room.height);
  for (var i = 0; i < ACCENT_LAYERS.length; i++){
    var acc = tintedLayer(ACCENT_LAYERS[i]);
    if (!acc){ return null; }                 /* build nothing rather than half of it */
    r.drawImage(acc, 0, 0, room.width, room.height);
  }
  roomKey = key;
  return room;
}

function accentLayersReady(){
  for (var i = 0; i < ACCENT_LAYERS.length; i++){ if (!tintedLayer(ACCENT_LAYERS[i])){ return false; } }
  return true;
}

function frameOf(p){
  var base = FACE[p.face] != null ? FACE[p.face] : 0;
  var a = p.anim;
  if (a && a.kind === "bob"){ return base + (Math.floor((now - a.t0) / 130) % 2 ? 2 : 0); }
  if (a && a.kind === "shrug"){ return base + ((now - a.t0) > 450 ? 2 : 0); }
  if (p.moving){ return base + WALK_CYCLE[Math.floor(now / 125) % 4]; }
  if (REDUCED){ return base; }
  return base + (Math.floor(now / 700) % 2 ? 2 : 0);    /* idle breathing */
}

function drawPerson(p){
  var img = IMAGES[p.id];
  if (!img || !img.naturalWidth){ return; }
  if (p.sitting && p.chair){ drawSeated(p, img); return; }
  g.drawImage(img, frameOf(p) * FRAME_W, 0, FRAME_W, FRAME_H,
              Math.round(p.x - FRAME_W / 2), Math.round(p.y - FEET_Y), FRAME_W, FRAME_H);
}

/* Someone at their desk: facing the monitor, legs hidden below the chair
   back, and the chair back drawn again on top of them so they sit IN it.
   There is no sitting pose in the art; this is the up-facing frame. */
function drawSeated(p, img){
  var c = p.chair;
  var top = p.y - FEET_Y;
  var cut = c.y + c.h * 0.64;                      /* the bottom of the chair back */
  g.save();
  g.beginPath();
  g.rect(p.x - FRAME_W, top - 4, FRAME_W * 2, cut - top + 4);
  g.clip();
  g.drawImage(img, frameOf(p) * FRAME_W, 0, FRAME_W, FRAME_H,
              Math.round(p.x - FRAME_W / 2), Math.round(top), FRAME_W, FRAME_H);
  g.restore();
  var back = chairBack(p);
  if (back){ g.drawImage(back, c.x, c.y, c.w, c.h); }
}
/* Just the chair's own pixels, cut from the finished room with the chair
   mask, so it wears the brand colour exactly as the floor does. */
function chairBack(p){
  var r = roomImage(), m = IMAGES.accents, c = p.chair;
  if (!r || !ready(m)){ return null; }
  if (p.back && p.backKey === roomKey){ return p.back; }
  var cvs = p.back || document.createElement("canvas");
  var w = Math.max(1, Math.round(c.w * S)), h = Math.max(1, Math.round(c.h * S));
  cvs.width = w; cvs.height = h;
  var t = cvs.getContext("2d");
  t.clearRect(0, 0, w, h);
  t.drawImage(r, c.x * S, c.y * S, c.w * S, c.h * S, 0, 0, w, h);
  t.globalCompositeOperation = "destination-in";
  t.drawImage(m, c.x * 2, c.y * 2, c.w * 2, c.h * 2, 0, 0, w, h);
  t.globalCompositeOperation = "source-over";
  p.back = cvs; p.backKey = roomKey;
  return cvs;
}

/* A badge above a coworker's head: "!" while the call is open, then a
   tick, a hollow tick or a cross once it has been made. The badge is
   UI, so it is the only thing here drawn in code. */
function drawMarker(p){
  var open = p.status === "open";
  var hurry = open && p.patience != null ? (1 - p.patience) : 0;
  var pulse = (open && !REDUCED && (nearP === p || hurry > 0.5)) ? (1 + 0.08 * Math.sin(now / (160 - 80 * hurry))) : 1;
  var bob = REDUCED ? 0 : Math.round(Math.sin(now / 460 + p.x) * 3);
  var cx = Math.round(p.x);
  var bw = Math.round(28 * pulse), bh = Math.round(32 * pulse), tailH = 9;
  var tipY   = Math.round(p.y - FRAME_H - 2 + bob);
  var bottom = tipY - tailH;
  var top    = bottom - bh;
  var left   = cx - bw / 2;
  var rows = [[14, 0], [9, 3], [4, 6]];
  var i, r;

  var fill = (p.status === "soft") ? PAINT.surface
           : (p.status === "wrong") ? PAINT.inkSoft
           : PAINT.accent;
  var glyph = (p.status === "soft") ? PAINT.accent : PAINT.onAccent;

  g.fillStyle = PAINT.surface;                 /* ring */
  g.fillRect(left - 2, top - 2, bw + 4, bh + 4);
  for (i = 0; i < rows.length; i++){
    r = rows[i];
    g.fillRect(cx - r[0] / 2 - 2, bottom + r[1], r[0] + 4, 3);
  }
  if (p.status === "soft"){                    /* hollow: an accent outline */
    g.fillStyle = PAINT.accent;
    g.fillRect(left - 2, top - 2, bw + 4, bh + 4);
  }
  g.fillStyle = fill;
  g.fillRect(left, top, bw, bh);
  for (i = 0; i < rows.length; i++){
    r = rows[i];
    g.fillRect(cx - r[0] / 2, bottom + r[1], r[0], 3);
  }
  if (p.status === "open"){
    g.fillStyle = PAINT.accentHi; g.fillRect(left, top, bw, 3);
    g.fillStyle = PAINT.accentLo; g.fillRect(left, top + bh - 3, bw, 3);
  }

  var my = top + bh / 2;
  g.fillStyle = glyph;
  if (p.status === "open"){
    g.fillStyle = PAINT.onAccent;
    g.fillRect(cx - 3, top + 8, 6, 12);
    g.fillRect(cx - 3, top + 23, 6, 6);
    var pat = p.patience == null ? 1 : p.patience;
    var low = pat < 0.3;
    if (!(low && !REDUCED && Math.floor(now / 250) % 2)){
      var bw2 = 34, by2 = top - 11;
      g.fillStyle = PAINT.surface;  g.fillRect(cx - bw2 / 2 - 2, by2 - 2, bw2 + 4, 8);
      g.fillStyle = PAINT.inkSoft;  g.fillRect(cx - bw2 / 2, by2, bw2, 4);
      g.fillStyle = low ? PAINT.accent : PAINT.accent2;
      g.fillRect(cx - bw2 / 2, by2, Math.round(bw2 * pat), 4);
    }
  } else if (p.status === "wrong"){
    for (i = -6; i <= 6; i += 3){ g.fillRect(cx + i - 1, my + i - 1, 3, 3); }
    for (i = -6; i <= 6; i += 3){ g.fillRect(cx + i - 1, my - i - 1, 3, 3); }
  } else {
    var tick = [[-7, -1], [-4, 2], [-1, 5], [2, 2], [5, -1], [8, -4]];
    for (i = 0; i < tick.length; i++){ g.fillRect(cx + tick[i][0], my + tick[i][1], 3, 3); }
  }
}

function drawSparkles(){
  for (var i = sparkles.length - 1; i >= 0; i--){
    var s = sparkles[i];
    var k = (now - s.t0) / s.dur;
    if (k >= 1){ sparkles.splice(i, 1); continue; }
    var r = 4 + 10 * k;
    g.globalAlpha = 1 - k;
    g.fillStyle = PAINT.accent2;
    g.fillRect(s.x - 2, s.y - r, 4, 6);
    g.fillRect(s.x - 2, s.y + r - 6, 4, 6);
    g.fillRect(s.x - r, s.y - 2, 6, 4);
    g.fillRect(s.x + r - 6, s.y - 2, 6, 4);
    g.globalAlpha = 1;
  }
}

var nearP = null;
function draw(){
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  g.imageSmoothingEnabled = (S < 1);
  g.imageSmoothingQuality = "high";
  g.setTransform(S, 0, 0, S, -cam.x * S, -cam.y * S);

  var built = roomImage();
  if (built){
    g.drawImage(built, 0, 0, WORLD.w, WORLD.h);
  } else {
    g.fillStyle = PAINT.surface;
    g.fillRect(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
  }

  var order = PEOPLE.slice().sort(function(a, b){ return a.y - b.y; });
  for (var i = 0; i < order.length; i++){
    drawPerson(order[i]);
    if (order[i].call >= 0 && order[i].status === "open"){ drawMarker(order[i]); }
  }
  drawSparkles();
}

/* ==================================================================
   THE LOOP
   ================================================================== */
var now = 0, last = 0, frames = 0;
function tick(ts){
  frames++;
  now = ts || 0;
  var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
  last = now;

  if (mode === "play"){ walkInput(dt); }
  officeLife(dt);
  for (var i = 0; i < PEOPLE.length; i++){ runAnim(PEOPLE[i], dt); }

  nearP = (mode === "play") ? nearestOpen() : null;
  aimCamera();
  draw();
  paintClock();
  paintFloaties();

  window.requestAnimationFrame(tick);
}

function paintClock(){
  if (clockTo !== shownMin){
    var k = Math.min(1, (now - clockAt) / 600);
    shownMin = clockFrom + (clockTo - clockFrom) * k;
    if (k >= 1){ shownMin = clockTo; }
  }
  byId("clock").textContent = clockText(shownMin);
  byId("dayfill").style.width = Math.min(100, shownMin / DAY_MINUTES * 100) + "%";
  byId("late-chip").hidden = minutes <= DAY_MINUTES;
}

function place(node, wx, wy){
  node.style.left = Math.round(screenX(wx)) + "px";
  node.style.top  = Math.round(screenY(wy)) + "px";
}
function paintFloaties(){
  var prompt = byId("prompt");
  if (mode === "play" && nearP){
    prompt.textContent = "Talk to " + nearP.name + "  (Enter or tap)";
    prompt.hidden = false;
    place(prompt, nearP.x, nearP.y - FRAME_H - 54);
  } else { prompt.hidden = true; }

  placeTalk();
  placeSigns();
  var pop = byId("popbubble");
  if (!pop.hidden){
    var who = null;
    for (var i = 0; i < PEOPLE.length; i++){ if (PEOPLE[i].id === pop.dataset.who){ who = PEOPLE[i]; } }
    if (who && who.status === "open"){
      /* beside the "!" badge and its patience bar, never over them */
      pop.style.transform = "translate(0,-100%)";
      place(pop, who.x + 20, who.y - FRAME_H - 12);
    } else if (who){
      pop.style.transform = "";
      place(pop, who.x + 30, who.y - FRAME_H + 4);
    }
  }
  var tag = byId("nametag");
  if (!tag.hidden && tag.dataset.who){
    for (var n = 0; n < PEOPLE.length; n++){
      if (PEOPLE[n].id === tag.dataset.who){ place(tag, PEOPLE[n].x, PEOPLE[n].y + 8); }
    }
  }
}

/* ==================================================================
   HOVER NAME TAGS
   ================================================================== */
function personAt(wx, wy){
  var order = PEOPLE.slice().sort(function(a, b){ return b.y - a.y; });
  for (var i = 0; i < order.length; i++){
    var p = order[i];
    if (wx >= p.x - 26 && wx <= p.x + 26 && wy >= p.y - FRAME_H + 4 && wy <= p.y + 4){ return p; }
  }
  return null;
}
function toWorld(e){
  var r = cv.getBoundingClientRect();
  return { x: cam.x + (e.clientX - r.left) / K, y: cam.y + (e.clientY - r.top) / K };
}
cv.addEventListener("pointermove", function(e){
  var w = toWorld(e), p = personAt(w.x, w.y), tag = byId("nametag");
  if (!p){ tag.hidden = true; return; }
  tag.innerHTML = "";
  tag.appendChild(document.createElement("s"));
  tag.appendChild(document.createTextNode(p.name));
  if (p.role){ tag.appendChild(el("i", null, p.role)); }
  tag.dataset.who = p.id;
  tag.hidden = false;
});
cv.addEventListener("pointerleave", function(){ byId("nametag").hidden = true; });

/* ---------- tap to walk, tap a coworker to talk ---------- */
cv.addEventListener("click", function(e){
  if (mode !== "play"){ return; }
  var w = toWorld(e);
  var p = personAt(w.x, w.y);
  if (p && p.call >= 0 && p.status === "open"){
    var d = Math.sqrt((p.x - JO.x) * (p.x - JO.x) + (p.y - JO.y) * (p.y - JO.y));
    if (d <= TALK_RANGE){ openTalk(p); return; }
    clearRoute();
    target = { x:p.x, y:p.y + 40 };
    pendingTalk = p;
    return;
  }
  if (hitsSolid(w.x, w.y)){ return; }
  clearRoute();
  target = { x:w.x, y:w.y };
  pendingTalk = null;
});

/* ==================================================================
   THE CALL: bubble, three choices, consequence
   ================================================================== */
function openTalk(p){
  if (!p || p.status !== "open"){ return; }
  var def = DECISIONS[p.call];
  if (!def){ return; }
  mode = "talk";
  talking = p; talkIndex = p.call; answered = false;
  clearRoute(); pendingTalk = null; JO.moving = false;
  keys = {};
  p.face = faceFor(JO.x - p.x, JO.y - p.y);   /* face the learner */
  JO.face = faceFor(p.x - JO.x, p.y - JO.y);

  byId("talk-who").textContent = (p.name + ", " + p.role).toUpperCase();
  byId("talk-callno").textContent = "CALL " + (handledCount() + 1) + " OF " + DECISIONS.length;
  lastCaller = p;
  byId("talk-heading").textContent = def.heading || "";
  byId("talk-say").textContent = personalize(def.situation);
  byId("talk-ask").textContent = personalize(def.ask);
  byId("talk-say").hidden = false;
  byId("talk-ask").hidden = false;
  byId("talk-verdict").hidden = true;
  byId("talkpanel").classList.remove("reply");

  var opts = byId("talk-opts");
  opts.innerHTML = "";
  (def.choices || []).forEach(function(c, n){
    var b = el("button", "opt");
    b.type = "button";
    b.setAttribute("data-key", c.key);
    b.appendChild(el("span", "k", String(n + 1)));
    b.appendChild(el("span", "t", c.text));
    b.addEventListener("click", function(){ pick(def, c, p); });
    opts.appendChild(b);
  });
  opts.hidden = false;
  var panel = byId("talkpanel");
  panel.hidden = false;
  byId("talkbody").scrollTop = 0;
  byId("hint-line").textContent = "Pick 1, 2 or 3.";
  placeTalk();

  send("screen", screenPayload(def.id, "Call " + (p.call + 1) + " of " + DECISIONS.length));
}

/* Put the bubble beside the talker's head, tail pointing at them, and keep it
   on the floor. Called when the bubble opens and every frame while it is open
   (the camera can move on a phone). On a phone the CSS pins it to the bottom
   and only the tail moves. */
function placeTalk(){
  var panel = byId("talkpanel");
  if (panel.hidden || !talking){ return; }
  var p = talking;
  var pad = cv.offsetLeft;                        /* the stage's inner padding */
  var floorL = pad, floorT = cv.offsetTop;
  var floorR = pad + cv.clientWidth, floorB = floorT + cv.clientHeight;
  var headX = screenX(p.x), headY = screenY(p.y - FRAME_H + 10);
  var tail = byId("talk-tail");
  var w = panel.offsetWidth, h = panel.offsetHeight;

  if (isPhone()){
    /* the bubble is fixed to the screen; the tail points at the talker's
       place on the screen, so it uses viewport coordinates */
    panel.className = "talkpanel tail-up" + (panel.classList.contains("reply") ? " reply" : "");
    var r = cv.getBoundingClientRect();
    var headXv = r.left + (p.x - cam.x) * K;
    var tx = Math.min(Math.max(headXv - 6 - 11, 14), w - 36);
    tail.style.left = tx + "px"; tail.style.top = ""; tail.style.right = "";
    return;
  }
  var gap = 22;
  var toLeft = headX > (floorL + floorR) / 2;      /* talker on the right: bubble to their left */
  var left = toLeft ? headX - gap - w : headX + gap;
  left = Math.min(Math.max(left, floorL + 6), floorR - 6 - w);
  var top = headY - Math.min(h * 0.55, 150);
  top = Math.min(Math.max(top, floorT + 6), floorB - 6 - h);
  panel.className = "talkpanel " + (toLeft ? "tail-right" : "tail-left") + (panel.classList.contains("reply") ? " reply" : "");
  panel.style.left = left + "px";
  panel.style.top = top + "px";
  var ty = Math.min(Math.max(headY - top - 11, 12), h - 34);
  tail.style.top = ty + "px"; tail.style.left = ""; tail.style.right = "";
}

function pick(def, c, p){
  if (answered){ return; }
  answered = true;
  var tone = toneOf(c);
  var right = rightChoice(def);
  chosen[def.id] = { key:c.key, right:!!c.right, text:c.text, tone:tone };
  answeredOrder.push(tone);

  send("answer", {
    id: def.id,
    question: def.heading || def.ask || def.id,
    choice: c.key,
    choiceText: c.text,
    correctChoice: right.key,
    correct: !!c.right,
    version: COURSE_VERSION
  });

  var buttons = byId("talk-opts").querySelectorAll(".opt");
  for (var n = 0; n < buttons.length; n++){
    var b = buttons[n];
    b.disabled = true;
    var k = b.getAttribute("data-key");
    if (k === c.key){ b.className = "opt picked"; }
    else if (k === right.key){ b.className = "opt reveal"; }
  }

  var cost = COST[tone];
  clockFrom = shownMin; clockTo = minutes + cost; clockAt = now;
  minutes += cost;

  p.status = (tone === "good") ? "right" : (tone === "soft") ? "soft" : "wrong";
  paintDots();

  /* The question bubble closes, the office reacts in the open (the coworker
     moves, the sign appears, Lena walks over on a wrong call), and only then
     the coworker's reply arrives as its own popup. Rachel, 2026-09-21: "the
     feedback should show up as a separate dialogue popup after the user
     submits ... there was no obvious reaction". */
  byId("talkpanel").hidden = true;
  mode = "react";
  byId("hint-line").textContent = "";
  react(p, tone);
  if (c.sign){ setSign(p, c.sign, tone); }

  var tag = byId("verdict-tag");
  tag.className = "tag" + (tone === "soft" ? " soft" : tone === "bad" ? " bad" : "");
  tag.textContent = tone === "good" ? "RIGHT CALL" : tone === "soft" ? "NEAR MISS" : "WRONG CALL";
  byId("verdict-text").textContent = personalize(c.consequence);
  byId("verdict-row").hidden = false;

  /* On a wrong call Lena has something to say once the coworker has
     answered. `lead` is her line; older content without one gets a
     neutral line rather than silence. */
  leadPending = (tone === "bad") ? (c.lead || "Let's go over that one together before the next swap comes in, " + JO.name + ".") : null;

  var startedAt = now;
  (function waitForReaction(){
    if (mode !== "react"){ return; }
    if (now - startedAt > 1300){ showReply(); return; }
    requestAnimationFrame(waitForReaction);
  })();
}

/* Continue: after a wrong call's reply, Lena comes over; after Lena has
   spoken, she walks back to her desk while the day carries on. */
function carryOn(){
  if (leadPending){ var line = leadPending; leadPending = null; lenaComesOver(line); return; }
  if (talking === LENA){ lenaGoesHome(); }
  closeTalk();
}

/* The coworker's reply, as its own speech bubble. */
function showReply(){
  var panel = byId("talkpanel");
  panel.classList.add("reply");
  byId("talk-say").hidden = true;
  byId("talk-ask").hidden = true;
  byId("talk-opts").hidden = true;
  byId("talk-verdict").hidden = false;
  panel.hidden = false;
  byId("talkbody").scrollTop = 0;
  placeTalk();
  mode = "beat";
  byId("hint-line").textContent = "Press Enter to carry on.";
  byId("continue-btn").focus();
}

function closeTalk(){
  byId("talkpanel").hidden = true;
  talking = null; talkIndex = -1;
  mode = "play";
  if (lastCaller){ sitDown(lastCaller); lastCaller = null; }
  byId("hint-line").textContent = "Back to it. Someone will need you soon.";
  if (handledCount() >= DECISIONS.length || minutes >= DAY_MINUTES){ endDay(); }
}

/* ==================================================================
   THE DOTS
   ================================================================== */
var NEED = 4;                            /* right calls Lena needs; GOAL.need overrides */
function paintGoal(){
  var s = scoreNow();
  byId("goal-have").textContent = String(s.right);
  byId("goal-need").textContent = String(NEED);
  var chip = byId("goalchip");
  if (s.right >= NEED){
    chip.className = "goalchip met";
    byId("goal-label").textContent = "right calls. " + LENA.name + " signs you off.";
  } else {
    chip.className = "goalchip";
    byId("goal-label").textContent = "right calls. " + LENA.name + " signs you off at " + NEED + ".";
  }
}
/* The day's marks fill left to right in the order the calls are made,
   whoever brought them (Rachel, 2026-09-27). */
var answeredOrder = [];
function paintDots(){
  paintGoal();
  var host = byId("dots");
  host.innerHTML = "";
  for (var i = 0; i < DECISIONS.length; i++){
    var tone = answeredOrder[i];
    var cls = "dot";
    var glyph = "";
    if (tone){
      cls += tone === "good" ? " right" : tone === "soft" ? " soft" : " wrong";
