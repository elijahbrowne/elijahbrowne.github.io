      glyph = tone === "bad" ? "✕" : "✓";
    }
    host.appendChild(el("span", cls, glyph));
  }
}

/* ==================================================================
   THE END OF THE DAY
   ================================================================== */
function endDay(){
  var s = scoreNow();
  mode = "end";
  show("end");

  var win = s.right >= NEED;
  byId("end-headline").textContent = win
    ? (GOAL.win  || "The day held. You're signed off.")
    : (GOAL.lose || "The day ran long. Let's look at those calls again.");
  /* The line under the headline has to stay true for the day that was
     actually played (review, 2026-09-29: at 4 of 5 the celebration said
     nobody broke a rule, right after the learner broke one). So it is
     picked by score, not by win or lose:
       every call right       -> finish.celebration
       at least half right    -> finish.mixed
       fewer than half right  -> finish.rough
     Older scenario.js files have no mixed or rough line, so they fall
     back to finish.closing (their advice for a day that was not perfect),
     and then to plain lines that are true at any score. The celebration
     only ever shows on a perfect day. */
  var perfect = s.right >= s.total;
  var mostly  = s.right >= Math.ceil(s.total / 2);
  byId("end-standfirst").textContent = perfect
    ? (FINISH.celebration || "Every call was right.")
    : mostly
    ? (FINISH.mixed || FINISH.closing || "Some of those calls need another look. Open the review to see which ones.")
    : (FINISH.rough || FINISH.closing || "Most of those calls need another look. Open the review, then play the day again.");
  byId("end-score").textContent = String(s.right);
  byId("end-total").textContent = String(s.total);

  var list = byId("recap");
  list.innerHTML = "";
  DECISIONS.forEach(function(d, i){
    var mine = chosen[d.id], right = rightChoice(d);
    var ok = !!(mine && mine.right);
    var li = el("li", ok ? "hit" : "miss");
    li.appendChild(el("span", "m", ok ? "✓" : "✕"));
    var t = el("span", "t");
    t.appendChild(el("b", null, "Call " + (i + 1) + ". " + (d.heading || d.id).replace(/^Call \d+\.\s*/, "")));
    t.appendChild(el("i", null, (FINISH.yourCallLabel || "Your call") + ": " + (mine ? mine.text : "—")));
    if (!ok){ t.appendChild(el("i", null, (FINISH.rightCallLabel || "Right call") + ": " + right.text)); }
    li.appendChild(t);
    list.appendChild(li);
  });

  if (!completedSent){
    completedSent = true;
    send("completed", { score:s.percent, min:0, max:100, correct:s.right, total:s.total, version:COURSE_VERSION });
  }
}

function restart(){
  chosen = {}; minutes = 0; shownMin = 0; clockFrom = 0; clockTo = 0;
  clearSigns();
  completedSent = false; answered = false; talking = null; talkIndex = -1; leadPending = null;
  target = null; pendingTalk = null; sparkles.length = 0;
  keys = {};
  timers = []; ringAt = 0; errandAt = 0; lastCaller = null; answeredOrder = [];
  SPOTS.forEach(function(sp){ sp.taken = false; });
  PEOPLE.forEach(function(p){
    p.x = p.home.x; p.y = p.home.y; p.face = p.home.face;
    p.status = p.call >= 0 ? "idle" : "lead"; p.anim = null; p.moving = false;
    p.job = null; p.errand = null; p.sitting = !!p.chair;
  });
  byId("popbubble").hidden = true;
  byId("talkpanel").hidden = true;
  byId("playrow").className = "playrow";
  paintDots();
  show("play");
}

/* ==================================================================
   SCREENS
   ================================================================== */
function screenPayload(id, title){
  var order = ["title"].concat(DECISIONS.map(function(d){ return d.id; })).concat(["finish"]);
  return { id:id, title:title, index:order.indexOf(id) + 1, of:order.length };
}
function show(which){
  ["title", "play", "end"].forEach(function(name){
    byId("screen-" + name).hidden = (name !== which);
  });
  if (which === "play"){
    mode = "play";
    byId("hint-line").textContent = "Everyone's at their desks. Someone will need you soon.";
    fit();
  }
  if (which === "title"){ mode = "title"; }
  byId("screen-" + which).focus();
  if (which === "title"){ send("screen", screenPayload("title", "Start")); }
  if (which === "end"){ send("screen", screenPayload("finish", "Your day")); }
}

/* ==================================================================
   KEYS
   ================================================================== */
var KEYMAP = {
  ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
  a:"left", d:"right", w:"up", s:"down", A:"left", D:"right", W:"up", S:"down"
};
document.addEventListener("keydown", function(e){
  if (e.metaKey || e.ctrlKey || e.altKey){ return; }
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA"){
    if (e.key === "Enter"){ byId("name-btn").click(); }
    return;
  }
  var dir = KEYMAP[e.key];
  if (dir && mode === "play"){ keys[dir] = true; e.preventDefault(); return; }

  if (mode === "talk" && (e.key === "1" || e.key === "2" || e.key === "3")){
    var b = byId("talk-opts").querySelectorAll(".opt")[Number(e.key) - 1];
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
    return;
  }
  if (e.key === "Enter" || e.key === " "){
    if (tag === "BUTTON"){ return; }
    e.preventDefault();
    if (mode === "title"){ byId("start-btn").click(); }
    else if (mode === "play" && nearP){ openTalk(nearP); }
    else if (mode === "beat"){ carryOn(); }
    else if (mode === "end"){ byId("again-btn").click(); }
  }
}, false);
document.addEventListener("keyup", function(e){
  var dir = KEYMAP[e.key];
  if (dir){ keys[dir] = false; }
}, false);

/* ==================================================================
   BUILD THE PAGE
   ================================================================== */
document.title = CONTENT.title || "Scenario";
byId("scene-title").textContent = CONTENT.title || "";
byId("title-h1").textContent    = CONTENT.title || "";
byId("footer-line").textContent = CONTENT.footer || "";
byId("brand-line").textContent  = CONTENT.brand || "";
byId("title-eyebrow").textContent = ((CONTENT.brand || "") + " training").toUpperCase();
var intro = CONTENT.intro || {};
byId("title-lede").textContent = intro.lede || "";
byId("title-goal").textContent = GOAL.line || "Handle all five before 5:00.";
if (GOAL.need){ NEED = GOAL.need; }
paintGoal();
(function(){
  var how = GOAL.how || [
    "Five coworkers each bring you one call. Walk over and answer.",
    "A right call costs no time. A near miss costs 30 minutes. A wrong call costs an hour, and the shift lead comes over.",
    "Don't keep people waiting too long: an empty patience bar costs 10 minutes.",
    "Get four of five right before 5:00 and the day is yours."
  ];
  var ul = byId("title-how");
  ul.innerHTML = "";
  how.forEach(function(line){ ul.appendChild(el("li", null, line)); });
})();
byId("name-label").textContent = intro.nameLabel || "Your name (optional)";
byId("learner-name").placeholder = intro.namePlaceholder || "";
byId("name-btn").textContent = intro.nameButton || "Use this name";
byId("name-hint").textContent = intro.nameHint || "";
byId("start-btn").textContent = intro.startLabel || "Let's start";

/* The brand's own logo, with the scenario's brand line as the fallback
   when there is no brand folder at all. */
(function(){
  var logos = [byId("brand-logo"), byId("title-logo"), byId("end-logo")];
  var text = byId("brand-fallback");
  function missing(){ logos.forEach(function(i){ i.hidden = true; }); text.hidden = false; }
  function arrived(){ logos.forEach(function(i){ i.hidden = false; }); text.hidden = true; }
  logos.forEach(function(img){
    img.alt = CONTENT.brand || "";
    img.addEventListener("error", missing);
    if (BRAND_DIR !== "brand/"){ img.src = BRAND_DIR + "logo.svg"; }
  });
  var first = logos[0];
  first.addEventListener("load", arrived);
  /* The tags carry their src in the markup, so they can have failed
     before these listeners existed. Ask directly as well. */
  if (first.complete){ if (first.naturalWidth > 0){ arrived(); } else { missing(); } }
})();

function readParam(name){
  try{
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : null;
  }catch(e){ return null; }
}
/* The learner's name. The coworkers speak to the learner by it; the art
   character stays Jo only when no name was given. (Rachel, 2026-09-21:
   "didn't i put in my name?") */
var learnerName = "";
function applyLearner(v){
  if (!v){ return; }
  /* An LMS sends "Last, First" (SCORM Cloud: "Weiss, Rachel"). Flip it, so
     coworkers say "Rachel, got a minute?", not "Weiss,, got a minute?". */
  if (v.indexOf(",") !== -1){
    v = v.split(",").map(function(s){ return s.trim(); }).filter(Boolean).reverse().join(" ");
  }
  learnerName = v;
  var first = v.split(" ")[0];
  JO.name = first;
  byId("namebox").hidden = true;
  try{ if (trackingOn && window.EMTrack){ window.EMTrack.setLearner({ name:v }); } }catch(e){}
}
/* Swap the character's placeholder name for the learner's, wherever the
   coworkers address them: "Jo, got a minute?" becomes "Rachel, got a minute?" */
function personalize(text){
  if (!text || !learnerName){ return text || ""; }
  var art = (window.SCENARIO && window.SCENARIO.art && window.SCENARIO.art.characterName) || "Jo";
  var first = learnerName.split(" ")[0];
  return text.replace(new RegExp("\\b" + art.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "g"), first);
}

byId("start-btn").addEventListener("click", function(){
  /* a name typed but not confirmed still counts */
  var v = byId("learner-name").value.replace(/\s+/g, " ").trim();
  if (v && !learnerName){ applyLearner(v); }
  show("play");
});
byId("continue-btn").addEventListener("click", carryOn);
byId("again-btn").addEventListener("click", restart);
byId("name-btn").addEventListener("click", function(){
  var v = byId("learner-name").value.replace(/\s+/g, " ").trim();
  if (v){ applyLearner(v); }
});

window.addEventListener("resize", fit);
if (window.ResizeObserver){ new ResizeObserver(fit).observe(byId("stagehost")); }

/* Handed to the playtest so it can check the day without guessing. */
window.GAME = {
  images: IMAGES, people: PEOPLE, world: WORLD, view: VIEW,
  paint: function(){ return PAINT; },
  accentLayer: function(){ return accentLayersReady(); },
  events: function(){ return EVENTS; },
  loaded: function(){
    var out = {}, k;
    for (k in IMAGES){ if (IMAGES.hasOwnProperty(k)){ out[k] = IMAGES[k].naturalWidth; } }
    return out;
  },
  screenOf: function(wx, wy){
    var r = cv.getBoundingClientRect();
    return { x: r.left + (wx - cam.x) * K, y: r.top + (wy - cam.y) * K };
  },
  setPatience: function(ms){ PATIENCE_MS = ms; },
  spotOf: function(i){
    var p = personFor(i);
    return p ? { x:p.x, y:p.y, id:p.id } : null;
  },
  state: function(){
    return {
      mode: mode, frames: frames, minutes: minutes, clock: byId("clock").textContent,
      jo: { x:Math.round(JO.x), y:Math.round(JO.y), face:JO.face },
      lena: { x:Math.round(LENA.x), y:Math.round(LENA.y) },
      near: nearP ? nearP.id : null,
      talking: talking ? talking.id : null,
      calling: (function(){ for (var i = 0; i < CAST.length; i++){ if (CAST[i].status === "open"){ return CAST[i].id; } } return null; })(),
      seated: CAST.filter(function(p){ return p.sitting; }).map(function(p){ return p.id; }),
      dots: answeredOrder.slice(),
      handled: handledCount(),
      statuses: CAST.map(function(p){ return p.id + ":" + p.status; }).join(","),
      score: scoreNow()
    };
  },
  /* the harness walks Jo without simulating 40 seconds of key presses */
  teleport: function(id){
    var p = personFor(typeof id === "number" ? id : 0);
    if (!p){ return false; }
    JO.x = p.x; JO.y = p.y + 40; JO.face = "up";
    target = null; pendingTalk = null;
    return true;
  }
};

paintDots();
fit();
window.requestAnimationFrame(tick);
applyLearner(readParam("learner_name"));
send("started", { title:CONTENT.title, version:COURSE_VERSION, decisions:DECISIONS.length });
show("title");
</script>
</body>
</html>
