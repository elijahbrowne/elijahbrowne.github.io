<body>
  <div id="root"></div>
  <!--noscript:start--><noscript><h1>Smartphone Content Creation: Mastering Framing and Audio</h1><p>What if your smartphone could become the only content-creation tool you need?</p><p>Email <a href="mailto:elijahbrowne48@gmail.com">elijahbrowne48@gmail.com</a> or see <a href="https://www.linkedin.com/in/elijahb0509/">LinkedIn</a>.</p></noscript><!--noscript:end-->
  <!-- No build step: compile App.jsx in the browser, point its "./content" import at content.js, then mount.
       Both files are fetched with cache: "no-cache" so visitors always get the latest version (unchanged files come back as a cheap 304). -->
  <script type="module">
    import { createElement } from "react";
    import { createRoot } from "react-dom/client";
    const root = document.getElementById("root");
    const fresh = async (path) => (await fetch(path, { cache: "no-cache" })).text();
    const moduleUrl = (js) => URL.createObjectURL(new Blob([js], { type: "text/javascript" }));
    try {
      const [src, contentSrc] = await Promise.all([fresh("./App.jsx"), fresh("./content.js")]);
      const { code } = Babel.transform(src, { filename: "App.jsx", presets: [["react", { runtime: "automatic" }]] });
      const content = moduleUrl(contentSrc);
      const js = code.replace(/from\s*["']\.\/content(\.js)?["']/g, `from "${content}"`);
      const { default: App } = await import(moduleUrl(js));
      createRoot(root).render(createElement(App));
    } catch (e) {
      console.error(e);
      root.innerHTML = '<p style="font-family:system-ui;padding:2rem">The site failed to load. If you opened index.html directly, serve the folder instead (e.g. <code>python3 -m http.server</code>).</p>';
    }
  </script>
